name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:   # znovupoužití z release.yml — vydání jede přes stejné testy

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Instalace uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Instalace závislostí
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Formát
        run: uv run ruff format --check src tests scripts

      - name: Testy
        # Běží proti uloženým fixtures, takže nepotřebují API klíč ani kredity.
        run: uv run pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalace uv
        uses: astral-sh/setup-uv@v5

      - name: Sestavení balíčku
        run: uv build

      - name: Kontrola metadat
        run: uvx twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
